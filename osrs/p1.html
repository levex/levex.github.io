<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verzik P1 Simulator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f11;
            --panel: #16161a;
            --ink: #e8e8e8;
            --line: #2a2a2e;
            --label: #54545e;
            --accent: #4ec94e;
            --yellow: #e8b84e;
            --red: #e54e4e;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            padding: 2rem 1.5rem 4rem;
        }

        .wrap {
            max-width: 680px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 2rem;
            font-size: 0.85rem;
            color: #5c5c66;
            text-decoration: none;
            transition: color 0.15s;
        }
        .back:hover { color: #aaa; }

        header { margin-bottom: 1.75rem; }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .tagline {
            font-size: 0.85rem;
            color: #82828c;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .section-label {
            font-size: 0.67rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--label);
            margin-bottom: 0.9rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .field + .field { margin-top: 1rem; }

        .field label {
            font-size: 0.75rem;
            color: #9a9aa4;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        input[type="number"], textarea {
            width: 100%;
            padding: 0.6rem 0.85rem;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--ink);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        textarea {
            height: 110px;
            resize: vertical;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.78rem;
        }

        input[type="number"]:focus, textarea:focus { border-color: #4a4a54; }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

        ::placeholder { color: #52525c; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            cursor: pointer;
            font-size: 0.82rem;
            color: #c8c8d0;
        }

        .checkbox-row input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .advanced-options {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }

        .hint-icon {
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: opacity 0.15s;
        }
        .hint-icon:hover { opacity: 1; }

        .button-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 140px;
            padding: 0.7rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: 1px solid transparent;
            transition: border-color 0.15s, color 0.15s, background 0.15s, transform 0.1s;
        }

        .btn-primary {
            background: var(--accent);
            color: #08140a;
        }
        .btn-primary:hover { background: #5ed65e; transform: translateY(-1px); }

        .btn-secondary {
            background: #202028;
            color: #dadada;
            border-color: #36363f;
        }
        .btn-secondary:hover { border-color: #5a5a66; background: #2a2a33; color: #fff; }

        .loading {
            text-align: center;
            padding: 2rem 1rem;
            color: #82828c;
            font-size: 0.85rem;
        }

        .spinner {
            border: 3px solid var(--line);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(229, 78, 78, 0.12);
            border: 1px solid var(--red);
            color: #ff8a8a;
            padding: 0.9rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.85rem 1rem;
        }

        .stat-card h4 {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8a8a94;
            margin-bottom: 0.4rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .dist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 1.25rem 0 0.75rem;
        }

        .dist-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--label);
        }

        .copy-btn {
            background: #202028;
            color: #dadada;
            border: 1px solid #36363f;
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            font-size: 0.72rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        .copy-btn:hover { border-color: #5a5a66; background: #2a2a33; color: #fff; }
        .copy-btn.copy-success { border-color: var(--accent); color: var(--accent); }

        .output-section {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 1rem;
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            font-size: 0.78rem;
            color: #c8c8d0;
            max-height: 320px;
            overflow-y: auto;
        }

        .output-section div { padding: 0.15rem 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="/osrs/">← back</a>
        <header>
            <h1>Verzik P1 Simulator</h1>
            <p class="tagline">Enter your full_code and run simulations</p>
        </header>

        <div class="panel">
            <div class="section-label">Configuration</div>

            <div class="field">
                <label for="fullCode">Code</label>
                <textarea id="fullCode" placeholder="Enter your full_code here...">5,0~12~12~0~0,D~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~H~x~x~S~x~x~x~x~D~x~x~x~D~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x C~x~x~x~D~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~x~D~x~x~x~D~!~x~x~S~x~x~x~x~S~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x H~x~x~S~x~x~x~x~D~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~C~x~x~x~S~x~x~x~x~D~x~x~x~D~!~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x B~x~S~x~x~x~x~S~x~x~x~x~D~x~x~x~D~x~x~x~D~x~x~x~D~x~x~x~D~!~x~x~D~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~ST~S~x~x~!~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~S~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x~x</textarea>
            </div>

            <div class="field">
                <label for="thrallCount">Number of Thralls</label>
                <input type="number" id="thrallCount" value="4" min="0" max="10">
            </div>

            <div class="field">
                <label for="simCount">Number of Simulations</label>
                <input type="number" id="simCount" value="15000" min="1000" max="100000">
            </div>

            <div class="field">
                <label class="checkbox-row">
                    <input type="checkbox" id="useZeal" checked>
                    Use Zeal (off = Piety)
                </label>
            </div>

            <div class="field">
                <label class="checkbox-row">
                    <input type="checkbox" id="showAdvanced" onchange="toggleAdvancedOptions()">
                    Show Advanced Options
                </label>
            </div>

            <div id="advancedOptions" class="advanced-options" style="display: none;">
                <div class="field">
                    <label for="dawnMax">
                        Dawn Auto Max Hit
                        <a href="https://oldschool.runescape.wiki/w/Dawnbringer#Maximum_hit" target="_blank" class="hint-icon" title="View Dawnbringer max hit formula on OSRS Wiki">ℹ</a>
                    </label>
                    <input type="number" id="dawnMax" value="21" min="1" max="50">
                </div>
                <div class="field">
                    <label for="timerTimeout">Verzik Timeout</label>
                    <input type="number" id="timerTimeout" value="116" min="50" max="200">
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" onclick="runSimulation()">Run Simulation</button>
            <button class="btn btn-secondary" onclick="clearResults()">Clear Results</button>
            <button class="btn btn-secondary" onclick="loadExample()">Load Example</button>
            <button class="btn btn-secondary" onclick="testBasicFunctionality()">Test Basic</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Running simulation... Please wait...</p>
        </div>

        <div id="results" class="panel" style="display: none;">
            <div class="section-label">Simulation Results</div>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        // Game constants
        const START_HP = 99;
        const START_STATS = 118;
        const BREW_AT = 68;
        const RESTORE_AT = 80;

        // Weapon definitions
        const WEAPONS = {
            scythe: { str: 75, atk: 125 },
            claw: { str: 56, atk: 57 },
            swift: { str: 0, atk: 0 }
        };

        // Combat constants
        const BP_MAX = 27;
        const BP_ACC = 6816;
        const SANG_MAX = 35;
        const SANG_ACC = 11175;

        class Rolls {
            constructor(dawnMax = 21) {
                this.bp_max = BP_MAX;
                this.bp_acc = BP_ACC;
                this.sang_max = SANG_MAX;
                this.sang_acc = SANG_ACC;
                this.dawn_max = dawnMax;
                this.weapons = {
                    scythe: { max: [], acc: [], str: 75, atk: 125 },
                    claw: { max: [], acc: [], str: 56, atk: 57 },
                    swift: { max: [], acc: [], str: 0, atk: 0 }
                };
                // Initialize with default team stats
                const defaultTeamStats = [START_STATS, START_STATS, START_STATS, START_STATS, START_STATS];
                this.updateWeaponStats(defaultTeamStats);
            }

            pot(player, teamHp, teamStats, potCooldown) {
                if (potCooldown[player] === 0) {
                    if (teamHp[player] < BREW_AT) {
                        teamHp[player] = Math.min(teamHp[player] + 16, 115);
                        teamStats[player] -= Math.floor(teamStats[player] * 0.1) + 2;
                        potCooldown[player] += 3;
                    } else {
                        if (teamHp[player] > 80 && teamStats[player] < 99) {
                            teamStats[player] = Math.min(99, teamStats[player] + (Math.floor(teamStats[player] * 3/10) + 10));
                            potCooldown[player] += 3;
                        }
                    }
                    this.updateWeaponStats(teamStats);
                }
            }

            maxHit(player, weapon, teamStats, rings) {
                const weaponBns = this.weapons[weapon].str;
                const effStr = Math.floor(Math.floor(teamStats[player] * PRAYER.str) + 11);
                const ringBonus = rings && rings[player] ? parseInt(rings[player]) : 0;
                const totalBns = (57 + 64 + weaponBns + ringBonus) / 640;
                return Math.floor(0.5 + (effStr * totalBns));
            }

            accRoll(player, weapon, teamStats) {
                const weaponBns = this.weapons[weapon].atk;
                const effAcc = Math.floor(Math.floor(teamStats[player] * PRAYER.att) + 8);
                const totalBns = 47 + 64 + weaponBns;
                return effAcc * totalBns;
            }

            updateWeaponStats(teamStats) {
                for (let weapon in this.weapons) {
                    this.weapons[weapon].max = [];
                    this.weapons[weapon].acc = [];
                    for (let i = 0; i < 5; i++) {
                        // Use default rings if not provided
                        const defaultRings = [0, 12, 12, 0, 0];
                        this.weapons[weapon].max.push(this.maxHit(i, weapon, teamStats, defaultRings));
                        if (this.weapons[weapon].acc !== undefined) {
                            this.weapons[weapon].acc.push(this.accRoll(i, weapon, teamStats));
                        }
                    }
                }
            }
        }

        function verzikRoll(playerDamage, style) {
            if (style === 'Melee') {
                return Math.min(Math.floor(Math.random() * 11), playerDamage);
            } else {
                return Math.min(Math.floor(Math.random() * 4), playerDamage);
            }
        }

        function scythe(player, rolls, teamStats) {
            const maxHit = rolls.maxHit(player, 'scythe', teamStats, [0, 12, 12, 0, 0]);
            const accRoll = rolls.accRoll(player, 'scythe', teamStats);

            const max1 = maxHit;
            const max2 = Math.floor(maxHit / 2);
            const max3 = Math.floor(maxHit / 4);

            let splat1 = 0, splat2 = 0, splat3 = 0;

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                splat1 = Math.max(1, verzikRoll(Math.floor(Math.random() * (max1 + 1)), 'Melee'));
            }

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                splat2 = Math.max(1, verzikRoll(Math.floor(Math.random() * (max2 + 1)), 'Melee'));
            }

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                splat3 = Math.max(1, verzikRoll(Math.floor(Math.random() * (max3 + 1)), 'Melee'));
            }

            return splat1 + splat2 + splat3;
        }

        function swift(player, rolls, teamStats) {
            const maxHit = rolls.maxHit(player, 'swift', teamStats, [0, 12, 12, 0, 0]);
            const accRoll = rolls.accRoll(player, 'swift', teamStats);

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                return Math.max(1, verzikRoll(Math.floor(Math.random() * (maxHit + 1)), 'Melee'));
            }
            return 0;
        }

        function claw(player, rolls, teamStats) {
            const maxHit = rolls.maxHit(player, 'claw', teamStats, [0, 12, 12, 0, 0]);
            const accRoll = rolls.accRoll(player, 'claw', teamStats);

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                return Math.max(1, verzikRoll(Math.floor(Math.random() * (maxHit + 1)), 'Melee'));
            }
            return 0;
        }

        function bp() {
            const maxHit = BP_MAX;
            const accRoll = BP_ACC;

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                return Math.max(1, verzikRoll(Math.floor(Math.random() * (maxHit + 1)), 'Ranged'));
            }
            return 0;
        }

        function sang() {
            const maxHit = SANG_MAX;
            const accRoll = SANG_ACC;

            if (Math.floor(Math.random() * (accRoll + 1)) > Math.floor(Math.random() * 2437)) {
                return Math.max(1, verzikRoll(Math.floor(Math.random() * (maxHit + 1)), 'Mage'));
            }
            return 0;
        }

        function dawnAuto(dawnMax = 21) {
            return Math.max(1, Math.floor(Math.random() * (dawnMax + 1)));
        }

        function dawnSpec() {
            return Math.floor(Math.random() * 76) + 75;
        }

        function attack(weapon, player, rolls, teamStats, teamHp) {
            if (weapon === 'ST') {
                teamHp[player] -= 10;
            }

            let hit = 0;

            switch (weapon) {
                case 'S':
                    hit = scythe(player, rolls, teamStats);
                    break;
                case 'B':
                    hit = bp();
                    break;
                case 'C':
                    hit = claw(player, rolls, teamStats);
                    break;
                case 'H':
                    hit = swift(player, rolls, teamStats);
                    break;
                case 'T':
                    hit = sang();
                    break;
                case 'D':
                    hit = dawnSpec();
                    break;
                case 'A':
                    hit = dawnAuto(rolls.dawn_max);
                    break;
            }

            return hit;
        }

        function thrall(scale) {
            if (scale === 0) return 0;

            let hit = 0;
            for (let i = 0; i < scale; i++) {
                const thrallSwing = Math.floor(Math.random() * 4);
                hit += verzikRoll(thrallSwing, 'Melee');
            }
            return hit;
        }

        function p1Sim(hp, fullCode, thrallCount, dawnMax = 21, timerTimeout = 116) {
            try {
                console.log('Starting p1Sim with hp:', hp, 'fullCode:', fullCode, 'thrallCount:', thrallCount);

                const splitCode = fullCode.split(',');
                console.log('Split code:', splitCode);

                const scale = parseInt(splitCode[0]);
                const rings = splitCode[1].split('~');
                const fullChart = splitCode[2];

                console.log('Scale:', scale, 'Rings:', rings, 'Full chart length:', fullChart.length);

                const chartParts = fullChart.split(' ');
                console.log('Chart parts:', chartParts.length, chartParts);

                // Validate that we have enough chart parts
                if (chartParts.length < 5) {
                    throw new Error('Invalid full_code: Not enough chart parts. Found ' + chartParts.length + ', need 5');
                }

                const teamHits = [
                    chartParts[0].split('~'),
                    chartParts[1].split('~'),
                    chartParts[2].split('~'),
                    chartParts[3].split('~'),
                    chartParts[4].split('~')
                ];

                console.log('Team hits lengths:', teamHits.map(hits => hits.length));

                const teamHp = [START_HP, START_HP, START_HP, START_HP, START_HP];
                const teamStats = [START_STATS, START_STATS, START_STATS, START_STATS, START_STATS];
                const potCooldown = [0, 0, 0, 0, 0];
                const verzikAutos = [21, 35, 49, 63, 77, 91, 105, 119, 133, 147];

                // Create rolls instance and update with correct rings
                const rolls = new Rolls(dawnMax);
                rolls.updateWeaponStats(teamStats);

                let timer = 0;
                let player = 0;
                let iterations = 0;
                const maxIterations = 1000; // Prevent infinite loops

                while (hp > 0 && iterations < maxIterations) {
                    iterations++;

                    // Add bounds checking for teamHits array access
                    if (player >= teamHits.length || timer >= teamHits[player].length) {
                        console.log('Reached end of chart. Player:', player, 'Timer:', timer);
                        break;
                    }

                    const weapon = teamHits[player][timer];
                    const damage = attack(weapon, player, rolls, teamStats, teamHp);
                    hp -= damage;

                    rolls.pot(player, teamHp, teamStats, potCooldown);
                    potCooldown[player] = Math.max(potCooldown[player] - 1, 0);

                    player++;
                    if (player >= 5) {
                        player = 0;
                        if (timer % 4 === 2) {
                            const thrallDamage = thrall(thrallCount);
                            hp -= thrallDamage;
                        }

                        if (verzikAutos.includes(timer - 1)) {
                            for (let i = 0; i < 5; i++) {
                                // Add bounds checking for verzik auto damage
                                if (timer - 4 >= 0 && i < teamHits.length && timer - 4 < teamHits[i].length && teamHits[i][timer - 4] !== 'P') {
                                    const verzikDamage = Math.floor(Math.random() * 69);
                                    teamHp[i] -= verzikDamage;
                                }
                            }
                        }

                        if (timer === timerTimeout) {
                            hp = -1;
                        }
                        if (hp > 0) {
                            timer++;
                        }
                    }
                }

                console.log('Simulation ended. Timer:', timer, 'HP:', hp, 'Iterations:', iterations);
                return timer + 1;
            } catch (error) {
                console.error('Error in p1Sim:', error);
                throw error;
            }
        }

        const PRAYERS = {
            piety: { att: 1.2, str: 1.23 },
            zeal: { att: 1.25, str: 1.28 }
        };
        let PRAYER = PRAYERS.zeal;

        function runSimulation() {
            PRAYER = document.getElementById('useZeal').checked ? PRAYERS.zeal : PRAYERS.piety;
            const fullCode = document.getElementById('fullCode').value.trim();
            const thrallCount = parseInt(document.getElementById('thrallCount').value);
            const simCount = parseInt(document.getElementById('simCount').value);
            const dawnMax = parseInt(document.getElementById('dawnMax').value);
            const timerTimeout = parseInt(document.getElementById('timerTimeout').value);

            if (!fullCode) {
                showError('Please enter a full_code');
                return;
            }

            // Debug: Log the full_code to console
            console.log('Full code:', fullCode);
            console.log('Thrall count:', thrallCount);
            console.log('Sim count:', simCount);

            showLoading();

            // Run simulation in a web worker or setTimeout to avoid blocking UI
            setTimeout(() => {
                try {
                    console.log('Starting simulation with:', { fullCode, thrallCount, simCount });

                    const splitCode = fullCode.split(',');
                    console.log('Split code length:', splitCode.length);

                    // Validate the full_code format
                    if (splitCode.length < 3) {
                        throw new Error('Invalid full_code format. Expected at least 3 parts separated by commas.');
                    }

                    const scale = parseInt(splitCode[0]);
                    console.log('Scale:', scale);

                    if (isNaN(scale) || scale < 0 || scale > 5) {
                        throw new Error('Invalid scale value. Must be a number between 0 and 5.');
                    }

                    let hp;
                    if (scale === 5) {
                        hp = 2000;
                    } else if (scale === 4) {
                        hp = 1750;
                    } else {
                        hp = 1500;
                    }

                    console.log('HP set to:', hp);

                    const killTimes = [];
                    let total = 0;

                    console.log('Starting', simCount, 'simulations...');

                    for (let x = 0; x < simCount; x++) {
                        if (x % 1000 === 0) {
                            console.log('Completed', x, 'simulations');
                        }

                        try {
                            const result = p1Sim(hp, fullCode, thrallCount, dawnMax, timerTimeout);
                            if (result > 0) {
                                killTimes.push(result);
                            }
                        } catch (simError) {
                            console.error('Error in simulation', x, ':', simError);
                            // Continue with other simulations
                        }
                    }

                    console.log('Completed all simulations. Valid results:', killTimes.length);

                    if (killTimes.length === 0) {
                        throw new Error('No valid simulation results. Check your full_code format.');
                    }

                    for (let ele of killTimes) {
                        total += ele;
                    }
                    const average = total / killTimes.length;

                    console.log('Average:', average, 'Total results:', killTimes.length);

                    // Count frequency of each kill time
                    const frequency = {};
                    for (let time of killTimes) {
                        frequency[time] = (frequency[time] || 0) + 1;
                    }

                    console.log('Frequency distribution:', frequency);

                    showResults(average, frequency, scale, thrallCount, killTimes.length, dawnMax);
                } catch (error) {
                    console.error('Simulation error:', error);
                    showError('Error running simulation: ' + error.message);
                }
            }, 100);
        }

        function showResults(average, frequency, scale, thrallCount, simCount, dawnMax) {
            hideLoading();

            const resultsDiv = document.getElementById('results');
            const contentDiv = document.getElementById('resultsContent');

            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>Average Time to Kill</h4>
                        <div class="stat-value">${average.toFixed(2)} ticks</div>
                    </div>
                    <div class="stat-card">

                    </div>
                    <div class="stat-card">
                        <h4>Simulations Run</h4>
                        <div class="stat-value">${simCount.toLocaleString()}</div>
                    </div>
                </div>
            `;

            // Add frequency distribution in Python format
            const sortedTimes = Object.keys(frequency).sort((a, b) => parseInt(a) - parseInt(b));
            let distText = '';
            html += '<div class="dist-header"><span class="dist-label">Kill Time Distribution</span><button class="copy-btn" onclick="copyDistribution(this)" title="Copy distribution">⧉ Copy</button></div>';
            html += '<div class="output-section">';

            for (let time of sortedTimes) {
                const count = frequency[time];
                html += `<div>${time}=${count},</div>`;
                distText += `${time}=${count},\n`;
            }
            html += '</div>';

            lastDistributionText = distText;
            contentDiv.innerHTML = html;
            resultsDiv.style.display = 'block';
        }

        let lastDistributionText = '';

        async function copyDistribution(btn) {
            try {
                await navigator.clipboard.writeText(lastDistributionText);
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = lastDistributionText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            const original = btn.innerHTML;
            btn.classList.add('copy-success');
            btn.innerHTML = '✓ Copied';
            setTimeout(() => {
                btn.classList.remove('copy-success');
                btn.innerHTML = original;
            }, 1500);
        }
