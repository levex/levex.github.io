<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuneLite Version History</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #0f0f11;
            color: #e8e8e8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            padding: 2rem 1.5rem 4rem;
        }

        .wrap {
            max-width: 680px;
            margin: 0 auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 2rem;
            font-size: 0.85rem;
            color: #5c5c66;
            text-decoration: none;
            transition: color 0.15s;
        }
        .back:hover { color: #aaa; }

        header { margin-bottom: 1.75rem; }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 0.3rem;
        }

        .tagline {
            font-size: 0.85rem;
            color: #82828c;
        }

        .seg {
            display: flex;
            border: 1px solid #2a2a2e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }

        .seg button {
            flex: 1;
            background: transparent;
            color: #9a9aa4;
            border: none;
            border-right: 1px solid #2a2a2e;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .seg button:last-child { border-right: none; }
        .seg button:hover { color: #ccc; background: #1a1a1e; }
        .seg button.on { background: #4ec94e; color: #08140a; }
        .seg button.on:hover { color: #08140a; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel {
            background: #16161a;
            border: 1px solid #2a2a2e;
            border-radius: 10px;
            padding: 1.25rem;
        }

        .refresh-btn {
            background: #202028;
            color: #dadada;
            border: 1px solid #36363f;
            border-radius: 6px;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            margin-bottom: 1rem;
        }
        .refresh-btn:hover { border-color: #5a5a66; background: #2a2a33; color: #fff; }

        .loading {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #82828c;
            font-size: 0.85rem;
        }

        .spinner {
            border: 3px solid #2a2a2e;
            border-top: 3px solid #4ec94e;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(229, 78, 78, 0.12);
            border: 1px solid #e54e4e;
            color: #ff8a8a;
            padding: 0.9rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            text-align: left;
            padding: 0.5rem 0.5rem;
            border-bottom: 1px solid #2a2a2e;
            color: #8a8a94;
            font-weight: 600;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid #1f1f23;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #1a1a1e; }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.55rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .badge { white-space: normal; }
        }

        .tag {
            background: rgba(229, 78, 78, 0.14);
            color: #e87a7a;
            border-color: rgba(229, 78, 78, 0.35);
        }

        .version {
            background: rgba(78, 201, 78, 0.14);
            color: #6fd66f;
            border-color: rgba(78, 201, 78, 0.35);
        }

        .maven-version {
            background: rgba(78, 201, 78, 0.14);
            color: #6fd66f;
            border-color: rgba(78, 201, 78, 0.35);
        }

        .maven-snapshot {
            background: rgba(232, 184, 78, 0.14);
            color: #e8b84e;
            border-color: rgba(232, 184, 78, 0.35);
        }

        .commit-hash {
            font-family: "SF Mono", "Fira Code", "Consolas", monospace;
            background: #0f0f11;
            border: 1px solid #2a2a2e;
            color: #c8c8d0;
            padding: 0.2rem 0.55rem;
            border-radius: 5px;
            font-size: 0.78rem;
            display: inline-block;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            vertical-align: middle;
        }

        .tag-link {
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .tag-link:hover { opacity: 0.8; }

        .version-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            background: #202028;
            color: #dadada;
            border: 1px solid #36363f;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            flex-shrink: 0;
            transition: border-color 0.15s, background 0.15s;
        }
        .copy-btn:hover { border-color: #5a5a66; background: #2a2a33; }
        .copy-btn:active { transform: scale(0.95); }

        .copy-success {
            border-color: #4ec94e !important;
            color: #4ec94e !important;
        }

        .last-updated {
            text-align: center;
            color: #5c5c66;
            font-size: 0.75rem;
            margin-top: 1rem;
        }

        .date-cell {
            color: #8a8a94;
            font-size: 0.8rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="/misc/">← back</a>
        <header>
            <h1>RuneLite Version History</h1>
            <p class="tagline">Version info from GitHub and the RuneLite Maven repository</p>
        </header>

        <div class="seg">
            <button class="on" onclick="switchTab('github')">GitHub Tags</button>
            <button onclick="switchTab('maven')">Maven Releases</button>
        </div>

        <!-- GitHub tab -->
        <div id="tab-github" class="tab-content active">
            <div class="panel">
                <button class="refresh-btn" onclick="fetchGitHubVersions()">↻ Refresh</button>

                <div id="gh-loading" class="loading">
                    <div class="spinner"></div>
                    <p>Fetching RuneLite versions...</p>
                </div>

                <div id="gh-error" class="error" style="display: none;"></div>

                <table id="gh-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Tag</th>
                            <th>RuneLite Version</th>
                            <th>Published</th>
                            <th>Commit Hash</th>
                        </tr>
                    </thead>
                    <tbody id="gh-body"></tbody>
                </table>

                <div id="gh-last-updated" class="last-updated"></div>
            </div>
        </div>

        <!-- Maven tab -->
        <div id="tab-maven" class="tab-content">
            <div class="panel">
                <button class="refresh-btn" onclick="fetchMavenVersions()">↻ Refresh</button>

                <div id="mv-loading" class="loading">
                    <div class="spinner"></div>
                    <p>Fetching Maven metadata...</p>
                </div>

                <div id="mv-error" class="error" style="display: none;"></div>

                <table id="mv-meta-table" style="display: none; margin-bottom: 1.5rem;">
                    <thead>
                        <tr>
                            <th>Latest</th>
                            <th>Release</th>
                            <th>Last Updated</th>
                        </tr>
                    </thead>
                    <tbody id="mv-meta-body"></tbody>
                </table>

                <table id="mv-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Recent Versions</th>
                        </tr>
                    </thead>
                    <tbody id="mv-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function switchTab(name) {
            document.querySelectorAll('.seg button').forEach((btn, i) => {
                btn.classList.toggle('on', ['github', 'maven'][i] === name);
            });
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.toggle('active', el.id === 'tab-' + name);
            });
        }

        // ── GitHub tab ────────────────────────────────────────────────────────

        async function fetchGitHubVersions() {
            const loading = document.getElementById('gh-loading');
            const error   = document.getElementById('gh-error');
            const table   = document.getElementById('gh-table');
            const footer  = document.getElementById('gh-last-updated');

            loading.style.display = 'block';
            error.style.display   = 'none';
            table.style.display   = 'none';

            try {
                const res = await fetch('https://api.github.com/repos/runelite/runelite/tags?per_page=20');
                if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
                const tags = await res.json();

                const top5 = tags
                    .filter(t => t.name.startsWith('runelite-parent-'))
                    .slice(0, 5);

                // Fetch commit dates in parallel
                const dated = await Promise.all(top5.map(async tag => {
                    let date = null;
                    try {
                        const cr = await fetch(tag.commit.url);
                        if (cr.ok) {
                            const cd = await cr.json();
                            date = cd.commit?.committer?.date || cd.commit?.author?.date || null;
                        }
                    } catch (_) {}
                    return {
                        tag:        tag.name,
                        version:    tag.name.replace('runelite-parent-', ''),
                        commitHash: tag.commit.sha,
                        date
                    };
                }));

                renderGitHubVersions(dated);
                footer.textContent = `Last updated: ${new Date().toLocaleString()}`;
            } catch (err) {
                console.error(err);
                error.style.display = 'block';
                error.textContent = `Error fetching versions: ${err.message}`;
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderGitHubVersions(versions) {
            const tbody = document.getElementById('gh-body');
            const table = document.getElementById('gh-table');
            tbody.innerHTML = '';

            versions.forEach(v => {
                const dateStr = v.date
                    ? new Date(v.date).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
                    : '—';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><a href="https://github.com/runelite/runelite/releases/tag/${v.tag}" target="_blank" class="tag-link"><span class="badge tag">${v.tag}</span></a></td>
                    <td>
                        <div class="version-container">
                            <span class="badge version">${v.version}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${v.version}', this)" title="Copy version">⧉</button>
                        </div>
                    </td>
                    <td class="date-cell">${dateStr}</td>
                    <td>
                        <div class="version-container">
                            <span class="commit-hash" title="${v.commitHash}">${v.commitHash}</span>
                            <button class="copy-btn" onclick="copyToClipboard('${v.commitHash}', this)" title="Copy commit hash">⧉</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            table.style.display = 'table';
        }

        // ── Maven tab ─────────────────────────────────────────────────────────

        const PROXY_URL = 'https://maven-worked.leventekurusa.workers.dev/';

        async function fetchMavenVersions() {
            const loading = document.getElementById('mv-loading');
            const error   = document.getElementById('mv-error');
            const table     = document.getElementById('mv-table');
            const metaTable = document.getElementById('mv-meta-table');
            const footer    = document.getElementById('mv-last-updated');

            loading.style.display   = 'block';
            error.style.display     = 'none';
            table.style.display     = 'none';
            metaTable.style.display = 'none';

            try {
                let text;
                const res = await fetch(PROXY_URL);
                if (!res.ok) throw new Error(`status ${res.status}`);
                text = await res.text();

                const xml = new DOMParser().parseFromString(text, 'text/xml');
                const versionEls = Array.from(xml.querySelectorAll('versions version'));
                const last5 = versionEls.slice(-5).reverse().map(el => el.textContent.trim());
                const latest          = xml.querySelector('versioning > latest')?.textContent?.trim() ?? '—';
                const release         = xml.querySelector('versioning > release')?.textContent?.trim() ?? '—';
                const lastUpdatedRaw  = xml.querySelector('lastUpdated')?.textContent?.trim() ?? '';
                const lastUpdatedStr  = lastUpdatedRaw.length === 14
                    ? parseMavenTimestamp(lastUpdatedRaw).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) + ' UTC'
                    : '—';

                renderMavenMeta(latest, release, lastUpdatedStr);
                renderMavenVersions(last5);
            } catch (err) {
                console.error(err);
                error.style.display = 'block';
                error.textContent = `Error fetching Maven metadata: ${err.message}`;
            } finally {
                loading.style.display = 'none';
            }
        }

        function parseMavenTimestamp(s) {
            // Format: yyyyMMddHHmmss (UTC)
            return new Date(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(8,10)}:${s.slice(10,12)}:${s.slice(12,14)}Z`);
        }

        function renderMavenMeta(latest, release, lastUpdated) {
            const tbody = document.getElementById('mv-meta-body');
            const table = document.getElementById('mv-meta-table');
            tbody.innerHTML = `
                <tr>
                    <td><span class="badge maven-snapshot">${latest}</span></td>
                    <td><span class="badge maven-version">${release}</span></td>
                    <td class="date-cell">${lastUpdated}</td>
                </tr>
            `;
            table.style.display = 'table';
        }

        function renderMavenVersions(versions) {
            const tbody = document.getElementById('mv-body');
            const table = document.getElementById('mv-table');
            tbody.innerHTML = '';

            versions.forEach(v => {
                const isSnapshot = v.endsWith('-SNAPSHOT');
                const badgeClass = isSnapshot ? 'maven-snapshot' : 'maven-version';
                const row = document.createElement('tr');
                row.innerHTML = `<td><span class="badge ${badgeClass}">${v}</span></td>`;
                tbody.appendChild(row);
            });

            table.style.display = 'table';
        }

        // ── Shared ────────────────────────────────────────────────────────────

        async function copyToClipboard(text, btn) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (_) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
            if (btn) {
                btn.classList.add('copy-success');
                btn.textContent = '✓';
                setTimeout(() => {
                    btn.classList.remove('copy-success');
                    btn.textContent = '⧉';
                }, 1500);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchGitHubVersions();
            fetchMavenVersions();
        });
    </script>
</body>
</html>
